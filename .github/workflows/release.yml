name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Git and API writes go through the App token; GITHUB_TOKEN only needs the
# id-token for npm OIDC trusted publishing.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.K35O_BOT_CLIENT_ID }}
          private-key: ${{ secrets.K35O_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        id: release
        uses: k35o/pnpm-release-action@5e009384bf5b1d2501f8405817b5d5578a90624e # v0.2.2
        with:
          build: pnpm build
          github-token: ${{ steps.generate-token.outputs.token }}
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

      # The composite Action is consumed as `k35o/storybook-addon-vrt@v<major>`;
      # keep that tag on the latest published release of the package. The push
      # uses the App token persisted by checkout.
      - name: Move the Action major tag
        if: steps.release.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.release.outputs['published-packages'] }}
        run: |
          version=$(jq -r '.[] | select(.name == "storybook-addon-vrt") | .version' <<< "$PUBLISHED_PACKAGES")
          [ -n "$version" ] || exit 0
          tag="v${version%%.*}"
          git tag -f "$tag"
          git push --force origin "$tag"
